name: ai_quan_ly_chi_tieu_ca_nhan
description: "Dự án quản lý chi tiêu cá nhân tích hợp AI và Firebase."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # --- QUẢN LÝ TRẠNG THÁI (STATE MANAGEMENT) ---
  # Dùng cho TransactionController (ChangeNotifier)
  provider: ^6.1.2
  # Dùng cho các màn hình sử dụng ConsumerWidget/ConsumerState
  flutter_riverpod: ^2.6.1

  # --- DỮ LIỆU LOCAL (DATABASE) ---
  # Cơ sở dữ liệu SQLite
  sqflite: ^2.4.2
  # Tìm đường dẫn thư mục lưu trữ trên điện thoại (Cần thiết cho sqflite)
  path: ^1.9.1
  path_provider: ^2.1.2

  # --- HỆ SINH THÁI FIREBASE (BACKEND) ---
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.0.2

  # --- ĐA NGÔN NGỮ (LOCALIZATION) ---
  easy_localization: ^3.0.8
  flutter_localizations:
    sdk: flutter

  # --- BIỂU ĐỒ (CHARTS) ---
  fl_chart: ^0.69.0

  # --- HIỆU ỨNG & ICON ---
  flutter_animate: ^4.5.2
  lucide_icons: ^0.257.0

  # --- TIỆN ÍCH & GIAO DIỆN (UTILS & UI) ---
  intl: ^0.20.1
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.15.0
  # Hiển thị thông báo đẹp ở phía trên màn hình
  top_snackbar_flutter: ^3.3.0
  # Bộ icon đa dạng từ nhiều nguồn
  iconify_flutter: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Khai báo cả thư mục translations để dùng easy_localization
    - lib/assets/translations/
    # Hoặc khai báo chi tiết từng file nếu bạn muốn chắc chắn
    - lib/assets/translations/en.json
    - lib/assets/translations/vi.json
    - lib/ui/ai_chat/robot.gif
    - lib/ui/ai_chat/hello.gif
